<ion-header [translucent]="true">
  <ion-toolbar class="tabs" color="white">
    <h3>Rekomendasi Berita untuk Kamu</h3>
    <p>Terakhir diperbaharui 26 menit lalu</p>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <ng-container *ngFor="let item of berita">
    <div *ngIf="item.rekomendasi" class="card-wrapper">

      <ion-card [routerLink]="['/detail-berita', item.id]" (click)="addViews(item.id)">
        <div class="card-content">
          
          <div class="image-box">
            <img [src]="item.gambarUrl" alt="Berita" />
          </div>

          <div class="info-box">
            <p class="judul">{{ item.judulBerita }}</p>
            <p><ion-text>{{ item.tanggalRilis }}</ion-text></p>
            <p><ion-text>by {{ item.penerbit }}</ion-text></p>

            <div class="rating-row">
              <ion-icon name="star" size="small" color="warning"></ion-icon>
              <span>{{ item.rating }} ({{ item.jumlahReview }} reviews)</span>

              <ion-icon name="eye-outline"></ion-icon>
              <span>{{ item.views }} views</span>
            </div>
          </div>

        </div>
      </ion-card>

      <!-- Favorite Button -->
      <ion-button
        fill="{{ checkIsFavorite(item.id) ? 'solid' : 'outline' }}"
        size="small"
        color="primary"
        (click)="addToFavorite(item)"
        class="fav-btn"
      >
        <ion-icon [name]="checkIsFavorite(item.id) ? 'bookmark' : 'bookmark-outline'"></ion-icon>
      </ion-button>

    </div>
  </ng-container>

</ion-content>

<ion-toast
  [isOpen]="isToastOpen"
  [message]="toastMessage"
  duration="1000"
  (didDismiss)="isToastOpen = false"
>
</ion-toast>
